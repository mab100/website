<div class="page-body">
<section class="cart-section">
  <div class="section-inner" style="max-width:720px">

  </div>

<!-- FOOTER -->

<script>
(function() {
  var cart = JSON.parse(localStorage.getItem('mab-cart') || '[]');
  var el = document.getElementById('cartContents');

  // Update nav badge
  var badge = document.getElementById('bagCount');
  if (badge && cart.length) {
    badge.textContent = cart.length;
    badge.classList.add('visible');
  }

  if (!cart.length) {
    el.innerHTML = '<div class="cart-empty"><p>Your bag is empty.</p><a href="index.html" class="btn-coral" style="margin-top:1.5rem;display:inline-block">Continue Shopping</a></div>';
    return;
  }

  var total = cart.reduce(function(sum, item) { return sum + item.price; }, 0);

  var rows = cart.map(function(item, i) {
    return '<div class="cart-row" id="cart-row-' + i + '">' +
      '<div class="cart-row-info">' +
        '<div class="cart-row-name">' + item.name + '</div>' +
        '<div class="cart-row-size">Size: ' + item.size + '</div>' +
      '</div>' +
      '<div class="cart-row-right">' +
        '<div class="cart-row-price">$' + item.price + '</div>' +
        '<button class="cart-remove" onclick="removeItem(' + i + ')">Remove</button>' +
      '</div>' +
    '</div>';
  }).join('');

  el.innerHTML = rows +
    '<div class="cart-summary">' +
      '<div class="cart-total"><span>Total</span><span>$' + total + '</span></div>' +
      '<p class="cart-note">This is a pre-order. You won\'t be charged until your item ships.</p>' +
      '<a href="https://forms.gle/wyEKR6wCprZCqFtW6" target="_blank" class="btn-coral cart-checkout">Reserve My Order</a>' +
    '</div>';
})();

function removeItem(index) {
  var cart = JSON.parse(localStorage.getItem('mab-cart') || '[]');
  cart.splice(index, 1);
  localStorage.setItem('mab-cart', JSON.stringify(cart));
  location.reload();
}
</script>
</body>
</html>
